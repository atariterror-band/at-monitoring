function safeUrl(value) {
  const url = new URL(value);
  if (!["https:", "http:"].includes(url.protocol) || url.username || url.password) throw Error("Odkaz musí začínat https:// nebo http://.");

    article.append(image);
  }
  const content = node("div",null,"card-body");
  const head = node("div",null,"card-head");

    item.estimatedDate ? "Přibližně " + dateLabel(item.estimatedDate) : "Datum vydání neznámé";
  head.append(node("span",item.platform + " / " + item.kind,"eyebrow"));
  if (showPublication) head.append(node("span",publication,"meta"));

  a.href = item.url;
  a.target = "_blank";

  return value.normalize("NFD").replace(/\p{Diacritic}/gu,"").toLowerCase();
}
function render() {
  const query = normalize(byId("query").value.trim());
  const compact = value => value.replace(/[^a-z0-9]/g,"");
  const compactQuery = compact(query);
  const items = all().filter(item => {
    if (activePlatform && activePlatform !== item.platform) return false;
    const haystack = normalize([item.title,item.source,item.author,item.summary,item.platform,item.kind].join(" "));
    return haystack.includes(query) || (compactQuery && compact(haystack).includes(compactQuery));
  });
  const publication = item => item.date || item.estimatedDate || "";
  const dated = items.filter(publication).sort((a,b)=>publication(b).localeCompare(publication(a)));
  const undated = items.filter(item=>!publication(item));
  byId("count").textContent = "Výsledky (" + items.length + ") · od nejnovějších";
  const timeline = document.createDocumentFragment();
  const monthLabel = new Intl.DateTimeFormat("cs-CZ", {month:"long",year:"numeric",timeZone:"UTC"});
  const dayLabel = new Intl.DateTimeFormat("cs-CZ", {day:"numeric",month:"numeric",timeZone:"UTC"});
  let currentMonth = "";
  for (const item of dated) {
    const value = publication(item);
    const date = new Date(value);
    const month = value.slice(0, 7);
    if (month !== currentMonth) {
      timeline.append(node("h2",monthLabel.format(date),"timeline-month"));
      currentMonth = month;
    }
    const dateText = dayLabel.format(date).replace(/\s/g,"");
    const time = node("time",(item.date ? "" : "≈") + dateText,"timeline-date");
    time.dateTime = value;
    time.setAttribute("aria-label",(item.date ? "" : "Přibližně ") + dateLabel(value));
    if (!item.date) {
      time.classList.add("estimated");
      time.title = "Přibližné datum publikace";
    }
    const row = node("div",null,"timeline-row");
    row.append(time,card(item,false));
    timeline.append(row);
  }
  byId("feed").replaceChildren(timeline);
  if (!items.length) byId("feed").append(node("p","Pro tento filtr tu zatím nejsou žádné zmínky.","empty muted"));
  byId("context").replaceChildren(...undated.map(item => card(item)));
  byId("undatedCount").textContent = "(" + undated.length + ")";
  byId("undated").hidden = !undated.length;
  if (!dated.length && undated.length) byId("undated").open = true;
}
byId("query").addEventListener("input",render);
form.addEventListener("submit",event=>{
  event.preventDefault();
  try {
    save([validate(Object.fromEntries(new FormData(form)))]);
    form.reset();
    byId("notice").textContent = "Zmínka uložena. Při shodném odkazu se aktualizoval původní záznam.";
  } catch(e) { byId("notice").textContent = e.message; }
});
render();
</script>
</body>
</html>
